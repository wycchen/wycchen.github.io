<!DOCTYPE html>
<html lang="en" data-lang="en" data-theme="light">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<title>Yu-Chi Chen | Taipei Tech</title>
	<meta name="description" content="Yu-Chi Chen (陳昱圻), Professor, Dept. of Computer Science and Information Engineering, National Taipei University of Technology. Cryptography, information security, privacy-enhancing technologies and blockchain." />
	<meta name="theme-color" content="#f3f5fa" />
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230A0F2E'/%3E%3Ctext x='16' y='21.5' font-family='monospace' font-size='14' font-weight='700' fill='%2338BDF8' text-anchor='middle'%3EYC%3C/text%3E%3C/svg%3E" />
	<script src="assets/js/boot.js"></script>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" />
	<link rel="stylesheet" href="assets/vendor/fontawesome/css/fontawesome.min.css" />
	<link rel="stylesheet" href="assets/vendor/fontawesome/css/solid.min.css" />
	<link rel="stylesheet" href="assets/vendor/fontawesome/css/regular.min.css" />
	<link rel="stylesheet" href="assets/vendor/fontawesome/css/brands.min.css" />
	<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
	<a class="skip" href="#view" data-i18n="skip">Skip to content</a>

	<div class="shell">

		<!-- ============ Profile panel ============ -->
		<aside class="profile" aria-label="Profile">
			<canvas class="cipher" aria-hidden="true"></canvas>
			<div class="profile-inner">
				<a class="profile-photo" href="#/">
					<img src="images/photo_YC.jpg" data-bind-src="photo" alt="" width="358" height="371" />
				</a>
				<h1 class="profile-name">
					<span data-bind="name"></span>
					<small data-bind="nameAlt"></small>
				</h1>
				<p class="profile-role" data-bind-html="role"></p>
				<ul class="profile-tags" data-bind-tags="tags"></ul>

				<div class="profile-actions">
					<a class="p-btn p-btn-main js-cv" data-bind-href="cv" download>
						<i class="fa-solid fa-file-arrow-down" aria-hidden="true"></i><span data-i18n="ui.cv">Download CV</span>
					</a>
					<a class="p-btn js-mail" href="#/contact" data-i18n-attr="aria-label:ui.email">
						<i class="fa-regular fa-envelope" aria-hidden="true"></i><span data-i18n="ui.email">Email</span>
					</a>
				</div>

				<ul class="profile-links" id="profile-links"></ul>
			</div>
		</aside>

		<!-- ============ Main ============ -->
		<div class="main">
			<header class="tabbar">
				<nav class="tabs" aria-label="Sections">
					<a href="#/" data-route="overview"><i class="fa-solid fa-house" aria-hidden="true"></i><span data-i18n="nav.overview">Overview</span></a>
					<a href="#/teaching" data-route="teaching"><i class="fa-solid fa-chalkboard-user" aria-hidden="true"></i><span data-i18n="nav.teaching">Teaching</span></a>
					<a href="#/news" data-route="news"><i class="fa-solid fa-bullhorn" aria-hidden="true"></i><span data-i18n="nav.news">News</span></a>
					<a href="#/contact" data-route="contact"><i class="fa-solid fa-at" aria-hidden="true"></i><span data-i18n="nav.contact">Contact</span></a>
				</nav>
				<div class="tools">
					<div class="tool lang-seg" role="group" data-i18n-attr="aria-label:ui.langSwitch"></div>
					<button type="button" class="tool js-theme" data-i18n-attr="aria-label:ui.themeSwitch">
						<i class="fa-solid fa-moon i-moon" aria-hidden="true"></i><i class="fa-solid fa-sun i-sun" aria-hidden="true"></i>
					</button>
				</div>
			</header>

			<main id="view" class="view" tabindex="-1" aria-live="polite"></main>

			<footer class="footer">
				<span>&copy; <span data-year></span> <span data-bind="name"></span></span>
			</footer>
		</div>
	</div>

	<script src="assets/vendor/marked/marked.umd.js"></script>
	<script src="assets/js/app.js"></script>
</body>
</html>
